<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="-apple-system, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif">
  <title>Homelab gateway: the internet, the cloud gateway, two tunnels home</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#0b2a2f"/>
    </linearGradient>
    <linearGradient id="gw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16324a"/>
      <stop offset="1" stop-color="#123040"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#9fb6c8"/>
    </marker>
    <marker id="ats" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#5eead4"/>
    </marker>
    <marker id="awg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#fbbf24"/>
    </marker>
    <marker id="abad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#f87171"/>
    </marker>
    <style>
      .t { fill: #e6eef5; }
      .m { fill: #9fb6c8; }
      .h { font-size: 15px; font-weight: 700; letter-spacing: .02em; }
      .s { font-size: 12.5px; }
      .xs { font-size: 11px; }
      .card { fill: #1b2a3c; stroke: #2c4560; stroke-width: 1.2; }
      .pill { fill: #0f2236; stroke: #2c4560; }
    </style>
  </defs>

  <rect width="1200" height="640" rx="18" fill="url(#bg)"/>

  <!-- column titles -->
  <text x="110" y="52" class="t h" text-anchor="middle">🌍 INTERNET</text>
  <text x="560" y="52" class="t h" text-anchor="middle">☁️ CLOUD GATEWAY · 203.0.113.10</text>
  <text x="1050" y="52" class="t h" text-anchor="middle">🏠 HOME · NO OPEN PORTS</text>

  <!-- internet -->
  <g>
    <rect x="30" y="110" width="160" height="78" rx="12" class="card"/>
    <text x="110" y="142" class="t s" text-anchor="middle" font-weight="600">👤 Family, apps</text>
    <text x="110" y="164" class="m xs" text-anchor="middle">https://photos.example.com</text>

    <rect x="30" y="230" width="160" height="70" rx="12" class="card" stroke="#7f1d1d"/>
    <text x="110" y="261" class="t s" text-anchor="middle" font-weight="600">🤖 Scanners</text>
    <text x="110" y="282" class="m xs" text-anchor="middle">brute force, CVE probes</text>

    <rect x="30" y="470" width="160" height="84" rx="12" class="card" stroke="#3b6b8f"/>
    <text x="110" y="500" class="t s" text-anchor="middle" font-weight="600">📱 Your phone</text>
    <text x="110" y="520" class="m xs" text-anchor="middle">WireGuard client</text>
    <text x="110" y="538" class="m xs" text-anchor="middle">10.66.0.2</text>
  </g>

  <!-- gateway box -->
  <rect x="250" y="76" width="620" height="530" rx="16" fill="url(#gw)" stroke="#2f5677" stroke-width="1.5"/>

  <!-- locks row -->
  <rect x="272" y="100" width="576" height="104" rx="12" fill="#0f2236" stroke="#2c4560"/>
  <text x="290" y="124" class="m xs" font-weight="700" letter-spacing=".08em">EVERY PUBLIC REQUEST PASSES</text>
  <g>
    <rect x="290" y="136" width="160" height="52" rx="10" class="card"/>
    <text x="370" y="158" class="t s" text-anchor="middle" font-weight="600">🛡️ CrowdSec</text>
    <text x="370" y="176" class="m xs" text-anchor="middle">banned? 403 / DROP</text>
    <rect x="480" y="136" width="160" height="52" rx="10" class="card" stroke="#2f7d6d"/>
    <text x="560" y="158" class="t s" text-anchor="middle" font-weight="600">🌐 Traefik</text>
    <text x="560" y="176" class="m xs" text-anchor="middle">:443 public · :8443 VPN</text>
    <rect x="670" y="136" width="160" height="52" rx="10" class="card"/>
    <text x="750" y="158" class="t s" text-anchor="middle" font-weight="600">🔐 Authelia</text>
    <text x="750" y="176" class="m xs" text-anchor="middle">who? may they? 2FA</text>
    <path d="M452 162h24" stroke="#9fb6c8" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M642 162h24" stroke="#9fb6c8" stroke-width="1.6" marker-end="url(#a)"/>
  </g>

  <!-- tunnel endpoints -->
  <text x="290" y="244" class="m xs" font-weight="700" letter-spacing=".08em">TUNNEL ENDPOINTS · ROUTES FROM TRAEFIK</text>
  <rect x="290" y="256" width="250" height="78" rx="12" class="card" stroke="#2f7d6d"/>
  <text x="306" y="282" class="t s" font-weight="600">🔁 Tailscale node + Headscale</text>
  <text x="306" y="302" class="m xs">100.64.0.0/10 via 172.28.0.40</text>
  <text x="306" y="320" class="m xs">first choice</text>

  <rect x="290" y="350" width="250" height="78" rx="12" class="card" stroke="#8a6a1c"/>
  <text x="306" y="376" class="t s" font-weight="600">🚇 trapdoor · WireGuard</text>
  <text x="306" y="396" class="m xs">10.66.0.0/24 via 172.28.0.30</text>
  <text x="306" y="414" class="m xs">fallback · and your devices' VPN</text>

  <!-- admin pages -->
  <rect x="580" y="256" width="268" height="172" rx="12" class="card" stroke="#3b6b8f"/>
  <text x="596" y="282" class="t s" font-weight="600">🙈 VPN-only admin pages</text>
  <text x="596" y="304" class="m xs">trapdoor · access rules · Traefik Manager</text>
  <text x="596" y="322" class="m xs">AdGuard · Headplane · start page</text>
  <rect x="596" y="338" width="236" height="74" rx="9" class="pill"/>
  <text x="610" y="358" class="t xs">entry point :8443, never published</text>
  <text x="610" y="376" class="t xs">VPN allow-list → Authelia (2FA)</text>
  <text x="610" y="394" class="t xs">→ the page's own login</text>

  <!-- dns + setup -->
  <rect x="290" y="448" width="250" height="62" rx="12" class="card"/>
  <text x="306" y="473" class="t s" font-weight="600">🧭 AdGuard Home</text>
  <text x="306" y="493" class="m xs">admin names → Traefik, ads blocked</text>

  <rect x="580" y="448" width="268" height="62" rx="12" class="card" stroke="#2f7d6d"/>
  <text x="596" y="473" class="t s" font-weight="600">🗺️ Traefik Manager · 🏁 foyer</text>
  <text x="596" y="493" class="m xs">routes in a browser · one start page</text>

  <rect x="290" y="528" width="558" height="58" rx="12" fill="#0f2236" stroke="#2f7d6d" stroke-dasharray="5 4"/>
  <text x="569" y="553" class="t s" text-anchor="middle" font-weight="600">⚙️ gateway.toml  →  ./setup.sh  →  docker compose up -d  →  ./setup.sh bootstrap</text>
  <text x="569" y="573" class="m xs" text-anchor="middle">one profile file: names, addresses, users, services; secrets, hashes and keys are generated</text>

  <!-- home -->
  <rect x="950" y="230" width="200" height="150" rx="14" class="card" stroke="#2f7d6d"/>
  <text x="1050" y="262" class="t s" text-anchor="middle" font-weight="600">🖥️ Home server</text>
  <text x="1050" y="284" class="m xs" text-anchor="middle">Home Assistant · photos</text>
  <text x="1050" y="302" class="m xs" text-anchor="middle">Nextcloud · media</text>
  <text x="1050" y="330" class="m xs" text-anchor="middle">100.64.0.10 (Tailscale)</text>
  <text x="1050" y="348" class="m xs" text-anchor="middle">10.66.0.10 (WireGuard)</text>
  <rect x="950" y="420" width="200" height="70" rx="14" class="card"/>
  <text x="1050" y="450" class="t s" text-anchor="middle" font-weight="600">📦 Home LAN</text>
  <text x="1050" y="470" class="m xs" text-anchor="middle">192.168.1.0/24</text>
  <path d="M1050 382v34" stroke="#9fb6c8" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="1050" y="540" class="m xs" text-anchor="middle">the home side dials out:</text>
  <text x="1050" y="558" class="m xs" text-anchor="middle">nothing opens on the router</text>

  <!-- flows -->
  <path d="M192 150 C 240 150, 240 162, 286 162" fill="none" stroke="#9fb6c8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M192 265 C 230 265, 240 180, 286 172" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#abad)"/>
  <text x="200" y="232" fill="#f87171" class="xs" font-weight="600">banned</text>
  <!-- Traefik down to endpoints -->
  <path d="M520 190 C 520 222, 470 230, 462 252" fill="none" stroke="#5eead4" stroke-width="2.2" marker-end="url(#ats)"/>
  <path d="M560 190 L560 378 Q560 392 546 392" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#awg)"/>
  <!-- tunnels -->
  <path d="M542 270 C 720 218, 880 218, 946 266" fill="none" stroke="#5eead4" stroke-width="3" marker-end="url(#ats)"/>
  <text x="760" y="214" fill="#5eead4" class="s" font-weight="700" text-anchor="middle">Tailscale tunnel (first)</text>
  <path d="M542 420 C 700 442, 880 442, 946 356" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-dasharray="9 6" marker-end="url(#awg)"/>
  <text x="898" y="426" fill="#fbbf24" class="s" font-weight="700" text-anchor="middle">WireGuard</text>
  <text x="898" y="460" fill="#fbbf24" class="xs" font-weight="600" text-anchor="middle">(fallback)</text>
  <!-- phone -->
  <path d="M192 505 C 240 505, 250 420, 286 405" fill="none" stroke="#7cc4ff" stroke-width="2" marker-end="url(#a)"/>
  <path d="M192 525 C 240 525, 250 485, 286 480" fill="none" stroke="#7cc4ff" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#a)"/>
  <text x="196" y="455" fill="#7cc4ff" class="xs" font-weight="600">VPN</text>
  <text x="200" y="562" fill="#7cc4ff" class="xs">DNS</text>

  <!-- legend -->
  <g transform="translate(930 600)">
    <path d="M0 0h26" stroke="#5eead4" stroke-width="3"/><text x="32" y="4" class="m xs">primary</text>
    <path d="M90 0h26" stroke="#fbbf24" stroke-width="2.4" stroke-dasharray="7 5"/><text x="122" y="4" class="m xs">fallback</text>
  </g>
</svg>
