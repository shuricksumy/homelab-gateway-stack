# Starting access rules for the gateway (copy to access_control.yml), then edit them in the
# configurator. Order matters: the first matching rule wins. The first four keep the portal,
# OIDC and the configurator working (the configurator protects them).
access_control:
  default_policy: deny # anything not listed below: no access

  networks:
    - name: vpn # VPN_CIDRS: trapdoor WireGuard, trapdoor OpenVPN, Tailscale
      networks: [10.8.10.0/24, 10.8.1.0/24, 100.64.0.0/10]

  rules:
    # 1. OIDC and discovery endpoints must be public, or logins with OIDC break.
    - domain: auth.example.com
      resources:
        - '^/\.well-known/openid-configuration$'
        - '^/jwks\.json$'
        - '^/api/oidc/.*'
      policy: bypass

    # 2. The portal itself.
    - domain: auth.example.com
      policy: one_factor

    # 3. The configurator: admins, on the VPN, with 2FA. Everyone else: a hard no.
    - domain: authcfg.example.com
      networks: [vpn]
      subject: 'group:admin'
      policy: two_factor
    - domain: authcfg.example.com
      policy: deny

    # 4. Every other admin page (trapdoor, AdGuard, Traefik Manager, Headplane, ZTNET, the start
    #    page, devices on the home LAN): the same as the configurator.
    - domain:
        - vpn.example.com
        - dns.example.com
        - tm.example.com
        - zt.example.com
        - start.example.com
        - router.example.com
      networks: [vpn]
      subject: 'group:admin'
      policy: two_factor
    - domain: hs.example.com
      resources: ['^/admin([/?].*)?$']
      networks: [vpn]
      subject: 'group:admin'
      policy: two_factor

    # 5. Family apps from anywhere, with 2FA.
    - domain: photos.example.com
      subject: ['group:admin', 'group:family']
      policy: two_factor
