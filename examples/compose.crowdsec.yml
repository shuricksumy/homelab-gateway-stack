# CrowdSec: reads Traefik's and Authelia's logs, bans addresses that probe or brute-force, and
# Traefik's bouncer plugin enforces the bans on every public site. Fails open: if CrowdSec is
# down, the sites stay up. From authelia-webui's examples/production/compose.crowdsec.yml; its
# docs/hardening.md and docs/firewall-bouncer.md go further (firewall bouncer, CDN, blocklists).
#
# Add to COMPOSE_FILE in .env, then docs/deploy.md phase 6:
#   printf '%s' "$CROWDSEC_BOUNCER_KEY" | sudo tee traefik/crowdsec-bouncer.key >/dev/null
#   sudo chown root:root traefik/crowdsec-bouncer.key && sudo chmod 600 traefik/crowdsec-bouncer.key
#   sudo mkdir -p data/crowdsec/config data/crowdsec/data
#   cp traefik/optional/security.yml traefik/dynamic/
#   # uncomment the CrowdSec lines in traefik/traefik.yml (entry point middlewares, plugins)
#   docker compose up -d crowdsec && docker compose up -d --force-recreate traefik

networks:
  crowdsec: {} # Traefik -> CrowdSec; not internal: CrowdSec fetches the hub and blocklists

services:
  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH] # read logs owned by other users; the mounts are read-only
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "15m", max-file: "3"}
    environment:
      TZ: ${TZ:-UTC}
      COLLECTIONS: >-
        crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios
        LePresidente/authelia crowdsecurity/whitelist-good-actors
      PARSERS: crowdsecurity/whitelists crowdsecurity/geoip-enrich # never bans private ranges
      CONTEXTS: crowdsecurity/http_base
      BOUNCER_KEY_traefik: ${CROWDSEC_BOUNCER_KEY:?set CROWDSEC_BOUNCER_KEY in .env}
    volumes:
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./data/crowdsec/config:/etc/crowdsec
      - ./data/crowdsec/data:/var/lib/crowdsec/data
      - ./data/logs/traefik:/var/log/traefik:ro # folders, not files: they survive logrotate
      - ./authelia/logs:/var/log/authelia:ro
    networks: [crowdsec]

  traefik:
    tmpfs: [/plugins-storage] # Traefik runs read-only; plugins are downloaded at start
    networks: [crowdsec]
    depends_on: [crowdsec]
