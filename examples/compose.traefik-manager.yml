# Traefik Manager (github.com/chr0nzz/traefik-manager): routes, services and middlewares in a
# browser. It edits traefik/dynamic/routes.yml only, reads Traefik's API on the unpublished
# tmapi entry point, and has no Docker socket. Set up as in authelia-webui's
# docs/traefik-manager.md, which explains every choice below.
#
# Add to COMPOSE_FILE in .env, then docs/deploy.md phase 7:
#   cp traefik/optional/traefik-manager.yml traefik/dynamic/
#   mkdir -p data/traefik-manager/{config,backups,vendor}
#   for f in dagre.min.js qrcode.min.js; do   # the image ships them root-only
#     docker run --rm --entrypoint cat ghcr.io/chr0nzz/traefik-manager:1.15.2 \
#       /app/static/vendor/$f > data/traefik-manager/vendor/$f; done
#   chmod 644 data/traefik-manager/vendor/*.js
#   sudo chown -R 1000:1000 traefik/dynamic data/traefik-manager
#   docker compose up -d && docker compose logs traefik-manager | grep -i password

services:
  traefik-manager:
    image: ghcr.io/chr0nzz/traefik-manager:1.15.2
    restart: unless-stopped
    user: "1000:1000" # owns traefik/dynamic and data/traefik-manager
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "15m", max-file: "3"}
    environment:
      TRAEFIK_API_URL: http://${IP_TRAEFIK}:8081 # an address, not a name (allow-listed by IP)
      CONFIG_PATH: /app/dynamic/routes.yml # your routes only; core, admin, security stay by hand
      DOMAINS: ${DOMAIN}
      CERT_RESOLVER: le
      COOKIE_SECURE: "true"
      TRUSTED_PROXIES: ${IP_TRAEFIK}/32
      TZ: ${TZ:-UTC}
    volumes:
      - ./traefik/dynamic:/app/dynamic # the folder: it saves with a temp file + rename
      - ./data/traefik-manager/config:/app/config
      - ./data/traefik-manager/backups:/app/backups
      - ./data/traefik-manager/vendor/dagre.min.js:/app/static/vendor/dagre.min.js:ro
      - ./data/traefik-manager/vendor/qrcode.min.js:/app/static/vendor/qrcode.min.js:ro
    networks:
      edge:
        ipv4_address: ${IP_TRAEFIK_MANAGER:?set IP_TRAEFIK_MANAGER in .env}
    depends_on: [traefik]
