# The core: Traefik (front door), Authelia (login + 2FA) with its configurator, AdGuard Home
# (DNS for VPN clients) and foyer (start page). The other parts are add-on files listed in
# COMPOSE_FILE (.env), in the order of docs/deploy.md.
#
#   cp .env.example .env               # fill it in
#   docker compose config -q && docker compose up -d
#
# Authelia, the configurator and the socket proxy follow authelia-webui's production example
# (github.com/shuricksumy/authelia-webui, examples/production): read its README for the files
# and secrets they need. This file adds the parts specific to a gateway with tunnels home.
name: gateway

x-hardened: &hardened
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-logging: &logging
  logging:
    driver: json-file
    options: {max-size: "15m", max-file: "3"} # a small VM: never let a log fill the disk

networks:
  edge: # Traefik and everything it routes to; fixed addresses come from .env
    name: edge
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:?set EDGE_SUBNET in .env}
  proxy:
    internal: true # the configurator and the Docker socket proxy only
  sessions:
    internal: true # Authelia and Redis only

services:
  traefik:
    <<: *logging
    image: traefik:v3.7.15
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:80"
      - "443:443"
      # No port for the internal entry point (8443): VPN clients reach Traefik's own address on
      # the edge network through the tunnel containers, so it is never on the public interface.
    environment:
      # DNS challenge (traefik.yml): the admin hosts are not resolvable from the internet.
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-} # Cloudflare; other providers use other variables
    volumes:
      - ./traefik:/etc/traefik:ro
      - ./data/letsencrypt:/letsencrypt
      - ./data/logs/traefik:/var/log/traefik # access log, read by CrowdSec (phase 6)
    networks:
      edge:
        ipv4_address: ${IP_TRAEFIK:?set IP_TRAEFIK in .env}

  # Adds the routes into the tunnels to Traefik's network namespace: VPN subnets, Tailscale,
  # ZeroTier and the home LAN, each via the container that owns that tunnel. Traefik itself
  # keeps no extra capability; this helper has NET_ADMIN in Traefik's namespace and nothing
  # else. It re-adds the routes every 30 s, so a restarted Traefik gets them back.
  traefik-routes:
    <<: [*hardened, *logging]
    image: alpine:3.22
    restart: unless-stopped
    network_mode: service:traefik
    cap_add: [NET_ADMIN]
    environment:
      ROUTES: >-
        ${WG_SUBNET}=${IP_VPN_WG}
        ${OVPN_SUBNET}=${IP_VPN_WG}
        ${HOME_LAN}=${IP_VPN_WG}
        ${TS_SUBNET}=${IP_TAILSCALE}
        ${ZT_SUBNET}=${IP_ZEROTIER}
    command: ["sh", "/etc/traefik/routes.sh"]
    volumes:
      - ./traefik/routes.sh:/etc/traefik/routes.sh:ro
    depends_on: [traefik]

  authelia:
    <<: *logging
    image: authelia/authelia:${AUTHELIA_VERSION:?set AUTHELIA_VERSION in .env}
    container_name: authelia # the socket proxy rules and AUTHELIA_CONTAINER use this name
    restart: unless-stopped
    user: "${AUTHELIA_UID:-1000}:${AUTHELIA_GID:-1000}"
    environment:
      X_AUTHELIA_CONFIG: /config/configuration.yml,/config/managed/access_control.yml,/config/managed/oidc_clients.yml,/config/managed/oidc_jwks.yml
      X_AUTHELIA_CONFIG_FILTERS: template
      AUTHELIA_SESSION_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      TZ: ${TZ:-UTC}
    volumes:
      - ./authelia:/config
    networks: [edge, sessions]
    depends_on: [redis]

  redis: # Authelia's sessions survive restarts (every configurator apply restarts Authelia)
    <<: [*hardened, *logging]
    image: redis:8-alpine
    restart: unless-stopped
    user: "${AUTHELIA_UID:-1000}:${AUTHELIA_GID:-1000}"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "60", "1", "--dir", "/data"]
    volumes:
      - ./data/redis:/data
    networks: [sessions]

  socket-proxy: # the only container that sees the Docker socket: inspect + restart Authelia
    <<: *logging
    image: wollomatic/socket-proxy:1.13.1
    restart: unless-stopped
    user: "65534:${DOCKER_GID:?set DOCKER_GID in .env}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64M
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      - -allowfrom=configurator
      - -allowGET=/v1\..{1,2}/containers/authelia/json
      - -allowPOST=/v1\..{1,2}/containers/authelia/restart
      - -allowhealthcheck
      - -shutdowngracetime=5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [proxy]

  configurator: # the Authelia configurator (authelia-webui): rules, users, OIDC clients
    <<: [*hardened, *logging]
    image: ghcr.io/shuricksumy/authelia-configurator:authelia-${AUTHELIA_VERSION}
    restart: unless-stopped
    user: "${AUTHELIA_UID:-1000}:${AUTHELIA_GID:-1000}"
    environment:
      AUTH_DOMAIN: auth.${DOMAIN:?set DOMAIN in .env}
      CONFIGURATOR_DOMAIN: authcfg.${DOMAIN}
      ADMIN_GROUP: ${ADMIN_GROUP:-admin}
      # VPN clients reach Traefik without NAT (Traefik routes back into the tunnels), so the
      # configurator sees their real VPN addresses. Fails closed when empty.
      ALLOWED_CLIENT_CIDRS: ${VPN_CIDRS:?set VPN_CIDRS in .env}
      CONFIG_FILTERS: template
      TRUSTED_PROXY_CIDRS: ${IP_TRAEFIK}/32
      AUTHELIA_CONTAINER: authelia
      AUTHELIA_HEALTH_URL: http://authelia:9091/api/health
      AUTHELIA_LOG_FILE: /config/logs/authelia.log
      DOCKER_PROXY_URL: http://socket-proxy:2375
      USERS_FILE: /config/managed/users.yml
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in .env}
      FRAME_ANCESTORS: https://start.${DOMAIN} # shown inside foyer
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/logs:/config/logs:ro
      - ./authelia/managed:/config/managed
    networks: [edge, proxy]
    depends_on:
      socket-proxy: {condition: service_healthy}
      authelia: {condition: service_started}

  adguard: # DNS for VPN clients: split DNS for the admin hosts, ad blocking
    <<: *logging
    image: adguard/adguardhome:v0.107.63
    restart: unless-stopped
    volumes:
      - ./data/adguard/work:/opt/adguardhome/work
      - ./data/adguard/conf:/opt/adguardhome/conf
    networks:
      edge:
        ipv4_address: ${IP_ADGUARD:?set IP_ADGUARD in .env}
    # No published ports: VPN clients use 172.30.0.53 through the tunnel; its web UI is routed
    # by Traefik on the internal entry point (traefik/dynamic/admin.yml).

  foyer: # start page (github.com/shuricksumy/foyer); your services are in ./foyer/config.yaml
    <<: *logging
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      # Only the files the page needs from a checkout in ./data/foyer (docs/deploy.md, phase 8),
      # never the whole folder: .git and the rest must not be served.
      - ./data/foyer/index.html:/usr/share/nginx/html/index.html:ro
      - ./data/foyer/css:/usr/share/nginx/html/css:ro
      - ./data/foyer/js:/usr/share/nginx/html/js:ro
      - ./data/foyer/icons:/usr/share/nginx/html/icons:ro
      - ./foyer/config.yaml:/usr/share/nginx/html/config.yaml:ro
    networks: [edge]
