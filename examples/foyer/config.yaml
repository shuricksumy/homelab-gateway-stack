# foyer start page (github.com/shuricksumy/foyer): the gateway's admin pages and your home
# services in one sidebar. foyer's own config.yaml documents every option.
# "embed: true" opens the page inside foyer; the admin UIs here allow it for
# https://start.example.com (TD_FRAME_ANCESTORS, FRAME_ANCESTORS in the compose files).
title: Gateway
theme: dark

groups:
  - name: Home
    icon: local:home
    items:
      - name: Home Assistant
        icon: local:home-assistant
        embed: false # the app sets its own frame policy
        link: { type: domain, value: https://home.example.com }
      - name: Photos
        icon: local:immich
        embed: false
        link: { type: domain, value: https://photos.example.com }

  - name: Gateway
    icon: local:server
    items:
      - name: VPN (trapdoor)
        icon: local:wireguard
        embed: true
        link: { type: domain, value: https://vpn.example.com:8443 }
      - name: Access rules (Authelia)
        icon: local:authelia
        embed: true
        link: { type: domain, value: https://authcfg.example.com:8443 }
      - name: Routes (Traefik Manager)
        icon: local:traefik
        embed: false
        link: { type: domain, value: https://tm.example.com:8443 }
      - name: Tailnet (Headplane)
        icon: local:tailscale
        embed: false
        link: { type: domain, value: https://hs.example.com:8443/admin }
      - name: DNS (AdGuard Home)
        icon: local:adguard
        embed: false
        link: { type: domain, value: https://dns.example.com:8443 }
