# Headplane: a minimal configuration. Compare with config.example.yaml of the Headplane
# version you run (HEADPLANE_VERSION).
server:
  host: 0.0.0.0
  port: 3000
  cookie_secret: "0123456789abcdef0123456789abcdef" # CHANGE: openssl rand -hex 16 (exactly 32 characters)
  cookie_secure: true

headscale:
  url: http://headscale:8080
  config_path: /etc/headscale/config.yaml
  config_strict: true

integration: # no Docker socket: Headplane cannot restart Headscale, you do it with compose
  docker:
    enabled: false
