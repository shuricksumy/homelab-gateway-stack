# Headscale: a minimal configuration. Compare with config-example.yaml of the Headscale
# version you run (HEADSCALE_VERSION); keys move between releases.
server_url: https://hs.example.com # what Tailscale clients connect to (through Traefik)
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes: # addresses for the nodes; Traefik routes 100.64.0.0/10 through the gateway's node
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp: # relays for nodes that cannot reach each other directly: Tailscale's public ones
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  auto_update_enabled: true
  update_frequency: 24h

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

dns:
  magic_dns: true
  base_domain: tail.example.net # must differ from server_url's domain
  override_local_dns: false # nodes keep their own DNS

log:
  level: info
