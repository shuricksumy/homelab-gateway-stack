# Admin pages: only on the internal entry point (VPN clients), behind the VPN allow-list and
# Authelia, and each with its own login on top. Their names resolve only through AdGuard
# (split DNS, docs/deploy.md phase 8), so from the internet they do not exist.
http:
  routers:
    trapdoor: # VPN servers and clients (compose.trapdoor.yml)
      rule: Host(`vpn.example.com`)
      entryPoints: [internal]
      service: trapdoor
      middlewares: [vpn-only, authelia]
      tls: {certResolver: le}

    adguard: # DNS for VPN clients
      rule: Host(`dns.example.com`)
      entryPoints: [internal]
      service: adguard
      middlewares: [vpn-only, authelia]
      tls: {certResolver: le}

    start: # foyer, the start page; it frames the admin pages above
      rule: Host(`start.example.com`)
      entryPoints: [internal]
      service: foyer
      middlewares: [vpn-only, authelia]
      tls: {certResolver: le}

    router-ui: # a device on the home LAN, reached through the tunnel (route to HOME_LAN)
      rule: Host(`router.example.com`)
      entryPoints: [internal]
      service: home-router
      middlewares: [vpn-only, authelia]
      tls: {certResolver: le}

  services:
    trapdoor: {loadBalancer: {servers: [{url: "http://trapdoor-web:8080"}]}}
    adguard: {loadBalancer: {servers: [{url: "http://adguard:3000"}]}}
    foyer: {loadBalancer: {servers: [{url: "http://foyer:80"}]}}
    home-router: {loadBalancer: {servers: [{url: "http://192.168.1.1"}]}}
