# Headscale (compose.headscale.yml). The control server must be public: every Tailscale client
# talks to it, before and after logging in, so no Authelia in front. Headplane, its admin UI,
# is VPN-only like the other admin pages.
http:
  routers:
    headscale:
      rule: Host(`hs.example.com`)
      entryPoints: [websecure]
      service: headscale
      tls: {certResolver: le}

    headplane:
      rule: Host(`hs.example.com`) && PathPrefix(`/admin`)
      entryPoints: [internal]
      service: headplane
      middlewares: [vpn-only, authelia]
      tls: {certResolver: le}

  services:
    headscale: {loadBalancer: {servers: [{url: "http://headscale:8080"}]}}
    headplane: {loadBalancer: {servers: [{url: "http://headplane:3000"}]}}
