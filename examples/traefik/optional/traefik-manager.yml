# Phase 7: copy to traefik/dynamic/. From authelia-webui's examples/production/traefik-manager/.
# Kept out of routes.yml on purpose: Traefik Manager edits routes.yml only, so it cannot remove
# its own protection or widen its API access.
http:
  routers:
    traefik-manager:
      rule: Host(`tm.example.com`)
      entryPoints: [internal]
      service: traefik-manager
      middlewares: [vpn-only, authelia]
      tls: {certResolver: le}

    traefik-manager-api: # Traefik's API, for Traefik Manager's own address only
      rule: PathPrefix(`/api`)
      entryPoints: [tmapi] # never published: only containers on the edge network reach it
      service: api@internal
      middlewares: [traefik-manager-only]

  middlewares:
    traefik-manager-only:
      ipAllowList:
        sourceRange: ["172.30.0.20/32"] # IP_TRAEFIK_MANAGER

  services:
    traefik-manager: {loadBalancer: {servers: [{url: "http://traefik-manager:5000"}]}}
