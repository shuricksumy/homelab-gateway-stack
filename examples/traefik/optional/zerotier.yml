# Phase 9 (optional): copy to traefik/dynamic/. ZTNET, the ZeroTier controller's web UI,
# VPN-only like the other admin pages.
http:
  routers:
    ztnet:
      rule: Host(`zt.example.com`)
      entryPoints: [internal]
      service: ztnet
      middlewares: [vpn-only, authelia]
      tls: {certResolver: le}
  services:
    ztnet: {loadBalancer: {servers: [{url: "http://ztnet:3000"}]}}
