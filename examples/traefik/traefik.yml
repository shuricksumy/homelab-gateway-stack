# Traefik static configuration: read at start only.
# After a change here: docker compose up -d --force-recreate traefik
# Routes, services and middlewares are in dynamic/ and reload by themselves.

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint: {to: websecure, scheme: https}

  websecure: # public: published on 80/443 in compose.yml
    address: ":443"
    # Phase 6 (CrowdSec) turns these on; until then leave them commented out:
    # http:
    #   middlewares: [realip@file, crowdsec@file] # before every router, so before Authelia
    #   aliasHeadersStrategy: delete

  internal: # VPN-only: never published; VPN clients reach Traefik's edge address directly
    address: ":8443"

  tmapi: # Traefik's API for Traefik Manager only (phase 7); never published
    address: ":8081"

api:
  dashboard: false # Traefik Manager reads the API through the tmapi entry point instead

certificatesResolvers:
  le:
    acme:
      email: admin@example.com # your ACME_EMAIL
      storage: /letsencrypt/acme.json
      # The admin hosts (vpn., authcfg., tm., ...) resolve only inside the VPN, so Let's
      # Encrypt cannot reach them over HTTP. A DNS challenge covers every name, public or not.
      # Put your DNS provider's token in Traefik's environment (see Traefik's docs).
      dnsChallenge:
        provider: cloudflare # or your DNS provider
      # Only public hosts? The HTTP challenge needs no token:
      # httpChallenge: {entryPoint: web}

providers:
  file:
    directory: /etc/traefik/dynamic # every .yml in it; Traefik Manager edits routes.yml
    watch: true

log:
  level: INFO

accessLog: # read by CrowdSec from phase 6 on
  filePath: /var/log/traefik/access.log
  format: json

