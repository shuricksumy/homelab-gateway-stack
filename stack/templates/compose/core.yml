# Generated deployment: Traefik, Authelia (+ Redis), the Authelia configurator and its Docker
# socket proxy. Values come from .env (setup.sh writes it from gateway.toml).
name: gateway

x-logging: &logging
  logging:
    driver: json-file
    options: {max-size: "15m", max-file: "3"} # a small server: no log may fill the disk

networks:
  edge: # Traefik and everything it routes to; fixed addresses are in .env
    name: edge
    ipam:
      config:
        - subnet: ${EDGE_SUBNET}
          # Containers without a fixed address get one from the upper half only, so the fixed
          # addresses (lower half: Traefik, the tunnel endpoints, AdGuard) are always free.
          ip_range: ${EDGE_DYNAMIC_RANGE}
  proxy:
    internal: true # the configurator and the socket proxy only
  sessions:
    internal: true # Authelia and Redis only

services:
  traefik:
    <<: *logging
    image: traefik:${TRAEFIK_VERSION}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    # NET_BIND_SERVICE: ports 80/443. NET_ADMIN: routes.sh adds the routes into the tunnels to
    # Traefik's own network namespace.
    cap_add: [NET_BIND_SERVICE, NET_ADMIN]
    # routes.sh every 30 s in the background (routes come back by themselves after a restart),
    # then Traefik as usual.
    entrypoint: ["/bin/sh", "-c", "while :; do sh /etc/traefik/routes.sh; sleep 30; done & exec /entrypoint.sh traefik"]
    security_opt: ["no-new-privileges:true"]
    environment:
      ROUTES: ${TUNNEL_ROUTES} # "<subnet>=<gateway>" pairs, see routes.sh
    env_file: [dns-provider.env] # the DNS provider's token for certificates (may be empty)
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
      # No port for the internal entry point (8443): VPN clients reach Traefik's own address on
      # the edge network through the tunnels, so it never exists on the public address.
    volumes:
      - ./traefik:/etc/traefik:ro
      - ./data/letsencrypt:/letsencrypt
      - ./data/logs/traefik:/var/log/traefik
    tmpfs: [/plugins-storage] # CrowdSec's plugins are downloaded at start (read-only image)
    networks:
      edge:
        ipv4_address: ${IP_TRAEFIK}

  authelia:
    <<: *logging
    image: authelia/authelia:${AUTHELIA_VERSION}
    container_name: authelia # the socket proxy rules and AUTHELIA_CONTAINER use this name
    restart: unless-stopped
    user: "1000:1000"
    environment:
      X_AUTHELIA_CONFIG: /config/configuration.yml,/config/managed/access_control.yml,/config/managed/oidc_clients.yml,/config/managed/oidc_jwks.yml
      X_AUTHELIA_CONFIG_FILTERS: template
      AUTHELIA_SESSION_REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ./authelia:/config
    networks: [edge, sessions]
    depends_on: [redis]

  redis: # sessions survive restarts (every configurator change restarts Authelia)
    <<: *logging
    image: redis:${REDIS_VERSION}
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "60", "1", "--dir", "/data"]
    volumes:
      - ./data/redis:/data
    networks: [sessions]

  socket-proxy: # inspect + restart of the Authelia container, nothing else
    <<: *logging
    image: wollomatic/socket-proxy:${SOCKET_PROXY_VERSION}
    restart: unless-stopped
    user: "65534:${DOCKER_GID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64M
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      - -allowfrom=configurator
      - -allowGET=/v1\..{1,2}/containers/authelia/json
      - -allowPOST=/v1\..{1,2}/containers/authelia/restart
      - -allowhealthcheck
      - -shutdowngracetime=5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [proxy]

  configurator: # authelia-webui: access rules, users, OIDC clients in a browser
    <<: *logging
    image: ghcr.io/shuricksumy/authelia-configurator:authelia-${AUTHELIA_VERSION}
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      AUTH_DOMAIN: ${HOST_LOGIN}
      CONFIGURATOR_DOMAIN: ${HOST_ACCESS}
      ADMIN_GROUP: ${ADMIN_GROUP}
      ALLOWED_CLIENT_CIDRS: ${VPN_CIDRS} # VPN clients reach Traefik without NAT: their own address
      CONFIG_FILTERS: template
      TRUSTED_PROXY_CIDRS: ${IP_TRAEFIK}/32
      AUTHELIA_CONTAINER: authelia
      AUTHELIA_HEALTH_URL: http://authelia:9091/api/health
      AUTHELIA_LOG_FILE: /config/logs/authelia.log
      DOCKER_PROXY_URL: http://socket-proxy:2375
      USERS_FILE: /config/managed/users.yml
      APP_SECRET_KEY: ${CONFIGURATOR_SECRET_KEY}
      FRAME_ANCESTORS: ${FRAME_ANCESTORS}
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/logs:/config/logs:ro
      - ./authelia/managed:/config/managed
    networks: [edge, proxy]
    depends_on:
      socket-proxy: {condition: service_healthy}
      authelia: {condition: service_started}
